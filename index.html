<body>
<div class="container">

  <h1>🔥 Life Challenge</h1>

  <div class="stats">
    <div>
      <p>Level</p>
      <span id="level">1</span>
    </div>

    <div>
      <p>XP</p>
      <span id="xp">0</span>
    </div>

    <div>
      <p>Streak</p>
      <span id="streak">0</span>
    </div>
  </div>

  <div class="card">
<h3>Choose Category</h3>

<select id="category">
  <option value="fitness">💪 Fitness</option>
  <option value="learning">📚 Learning</option>
  <option value="money">💰 Money</option>
  <option value="productivity">🧠 Productivity</option>
  <option value="social">🌍 Social</option>
</select>

<br><br>

    <h2>Today's Challenge</h2>
    <p id="challenge">Loading...</p>

    <button class="complete" onclick="completeChallenge()">
      I Completed It ✅
    </button>

    <button class="next" onclick="newChallenge()">
      Next Challenge 🔄
    </button>
  </div>

</div>
